name: Workbench checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:studio
      - run: npm run test:studio
      - run: npm run test:workflow
      - run: npm run test:geometry
